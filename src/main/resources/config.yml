MONGO:
  HOST: 127.0.0.1
  PORT: 27017
  DATABASE: Ninja
  AUTHENTICATION:
    ENABLED: false
    USERNAME: ''
    PASSWORD: ''
REDIS:
  HOST: 127.0.0.1
  PORT: 6379
  AUTHENTICATION:
    ENABLED: false
    PASSWORD: ''
SETTINGS:
  UPDATE_PLAYER_LIST_NAME: true
PUNISHMENTS:
  BROADCAST: "&r{target} &ahas been {context} by &r{sender}"
  BROADCAST_SILENT: "&7(Silent) &r{target} &ahas been {context} by &r{sender}"
  BAN:
    KICK: "&6Your account is {context} from Katana Network.{temporary}\n\n&6If you feel this punishment is unjust, you may appeal at:\n&ehttps://www.aikar.cc"
    TEMPORARY: "\n&6This punishment expires in &e{time-remaining}&6."
  KICK:
    KICK: "&6You were kicked by a staff member.\nReason: &e{reason}"
COMMON_ERRORS:
  FAILED_TO_LOAD_PROFILE: "&6Failed to load your profile. Try again later."
  COULD_NOT_RESOLVE_PLAYER: "&6Could not resolve player information..."
  PLAYER_NOT_FOUND: "&6A player with that name could not be found."
  RANK_NOT_FOUND: "&6A rank with that name could not be found."
SERVER:
  START: "The server is starting!"
STAFF:
  CHAT: "&9[S] &b({1}) &r{0}&7: {2}"
  REPORT_BROADCAST:
    - "&9[R] &b[{3}] &r{1} &7reported by &r{0}"
    - "   &9Reason&7: {2}"
  REQUEST_BROADCAST:
    - "&9[R] &b[{2}] &r{0} &7has requested assistance"
    - "   &9Reason&7: {1}"
  REQUEST_SUBMITTED: "&aYour request for assistance has been submitted to all available staff members."
CHAT:
  FORMAT: "%1$s&r: %2$s"
  CLEAR_CHAT_BROADCAST: "&eThe chat has been cleared by &r{0}"
  CLEAR_CHAT_FOR_STAFF: false
  MUTE_CHAT_BROADCAST: "&eThe chat has been {0} by &r{1}"
  DELAY_CHAT_ENABLED_BROADCAST: "&eThe chat has been delayed by &r{0} &7({1} second{2})"
  DELAY_CHAT_DISABLED_BROADCAST: "&eThe chat delay has been lifted by &r{0}"
  CHAT_DELAYED: "&6Slow down! You may chat again in {0} seconds."
# using both text formatter and text replacing because I need to escape colors in the input message
# format: player name, player display name, player color, target name, target display name, target color
CONVERSATION:
  SEND_MESSAGE: "&d(To &r{5}{3}&d) %MSG%"
  RECEIVE_MESSAGE: "&d(From &r{5}{3}&d) %MSG%"
OPTIONS:
  GLOBAL_CHAT_ENABLED: "&eYou can now see global chat."
  GLOBAL_CHAT_DISABLED: "&6You will no longer see global chat."
  PRIVATE_MESSAGES_ENABLED: "&aYou can now receive new conversations."
  PRIVATE_MESSAGES_DISABLED: "&6You can no longer receive new conversations. If you start a conversation with a player, they will be able to message you back."
  PRIVATE_MESSAGE_SOUNDS_ENABLED: "&eYou enabled private message sounds."
  PRIVATE_MESSAGE_SOUNDS_DISABLED: "&6You disabled private message sounds."
GLOBAL_WHITELIST:
  KICK_MAINTENANCE: "&6The server is currently in maintenance.\nCheck our discord for more announcements!"
  KICK_CLOSED_TESTING: "&6You are not whitelisted. To gain early access, you can\npurchase an eligible rank &7(&6Gold+&7) &6on our store.\n&fhttps://store.aikar.cc"
